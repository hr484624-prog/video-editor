<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GyanCut - Video Editor</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#0d0e11;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

/* TOP BAR */
.topbar{
    height:58px;
    background:#17181c;
    border-bottom:1px solid #292b31;
    display:flex;
    align-items:center;
    padding:0 18px;
    gap:15px;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.logo span{
    color:#a855f7;
}

.project-name{
    color:#8d8f98;
    font-size:14px;
}

.import-btn{
    margin-left:auto;
    background:#8b5cf6;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.import-btn:hover{
    background:#7c3aed;
}

/* MAIN */
.main{
    display:flex;
    height:calc(100vh - 58px);
}

/* SIDEBAR */
.sidebar{
    width:190px;
    background:#15161a;
    border-right:1px solid #292b31;
    padding:10px 7px;
    overflow-y:auto;
}

.menu{
    display:block;
    color:#aeb0b8;
    text-decoration:none;
    padding:12px 10px;
    border-radius:8px;
    margin-bottom:3px;
    font-size:14px;
}

.menu:hover,
.menu.active{
    background:#29202f;
    color:#fff;
}

/* WORKSPACE */
.workspace{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

/* PREVIEW */
.preview-area{
    flex:1;
    background:#08090b;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

#videoPreview{
    max-width:88%;
    max-height:88%;
    display:none;
    border-radius:4px;
}

.empty{
    text-align:center;
    color:#686a72;
}

.empty-icon{
    font-size:48px;
    margin-bottom:12px;
}

.empty p{
    font-size:14px;
}

/* TOOLBAR */
.toolbar{
    min-height:72px;
    background:#17181c;
    border-top:1px solid #292b31;
    border-bottom:1px solid #292b31;
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px;
    overflow-x:auto;
}

.tool{
    min-width:75px;
    background:#23252b;
    color:#ddd;
    border:1px solid #33353d;
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    text-align:center;
    font-size:12px;
}

.tool:hover{
    background:#30283a;
    border-color:#8b5cf6;
}

.tool-icon{
    display:block;
    font-size:20px;
    margin-bottom:4px;
}

/* TIMELINE */
.timeline{
    height:210px;
    background:#121318;
    padding:10px;
    overflow:auto;
}

.timeline-head{
    display:flex;
    justify-content:space-between;
    color:#777983;
    font-size:11px;
    margin-bottom:7px;
}

.track-label{
    color:#777983;
    font-size:10px;
    margin:6px 0;
}

.track{
    height:52px;
    background:#0b0c0f;
    border:1px solid #292b31;
    border-radius:6px;
    margin-bottom:9px;
    padding:5px;
    position:relative;
}

.clip{
    height:100%;
    min-width:160px;
    width:220px;
    background:#7137c8;
    border-radius:5px;
    padding:12px;
    font-size:12px;
    overflow:hidden;
    white-space:nowrap;
}

.audio-track{
    background:#174f4b;
}

/* MOBILE */
@media(max-width:700px){

    .sidebar{
        width:62px;
    }

    .menu{
        font-size:0;
        text-align:center;
        padding:12px 3px;
    }

    .menu::first-letter{
        font-size:20px;
    }

    .project-name{
        display:none;
    }

    .logo{
        font-size:18px;
    }

    .timeline{
        height:180px;
    }

    .toolbar{
        min-height:70px;
    }
}
</style>
</head>

<body>

<!-- TOP BAR -->
<header class="topbar">

    <div class="logo">
        ✂️ Gyan<span>Cut</span>
    </div>

    <div class="project-name">
        My Video Project
    </div>

    <button class="import-btn" onclick="openFile()">
        ＋ Import
    </button>

    <input
        type="file"
        id="fileInput"
        accept="video/*,image/*"
        hidden
        onchange="importMedia(this)"
    >

</header>


<!-- MAIN -->
<div class="main">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <a class="menu active" href="index.html">
            🎬 Editor
        </a>

        <a class="menu" href="media.html">
            📁 Media
        </a>

        <a class="menu" href="trim.html">
            ✂️ Trim
        </a>

        <a class="menu" href="text.html">
            📝 Text
        </a>

        <a class="menu" href="audio.html">
            🎵 Audio
        </a>

        <a class="menu" href="filters.html">
            🎨 Filters
        </a>

        <a class="menu" href="speed.html">
            ⚡ Speed
        </a>

        <a class="menu" href="transform.html">
            🔄 Transform
        </a>

        <a class="menu" href="effects.html">
            ✨ Effects
        </a>

        <a class="menu" href="stickers.html">
            ⭐ Stickers
        </a>

        <a class="menu" href="timeline.html">
            🎞️ Timeline
        </a>

        <a class="menu" href="preview.html">
            👁️ Preview
        </a>

        <a class="menu" href="export.html">
            📤 Export
        </a>

        <a class="menu" href="settings.html">
            ⚙️ Settings
        </a>

    </aside>


    <!-- EDITOR -->
    <section class="workspace">

        <!-- VIDEO PREVIEW -->
        <div class="preview-area">

            <video
                id="videoPreview"
                controls
                playsinline>
            </video>

            <div class="empty" id="emptyScreen">

                <div class="empty-icon">
                    🎬
                </div>

                <p>
                    Import a video or photo to start editing
                </p>

            </div>

        </div>


        <!-- EDITING TOOLS -->
        <div class="toolbar">

            <button class="tool" onclick="go('media.html')">
                <span class="tool-icon">📁</span>
                Media
            </button>

            <button class="tool" onclick="go('trim.html')">
                <span class="tool-icon">✂️</span>
                Trim
            </button>

            <button class="tool" onclick="go('text.html')">
                <span class="tool-icon">📝</span>
                Text
            </button>

            <button class="tool" onclick="go('audio.html')">
                <span class="tool-icon">🎵</span>
                Audio
            </button>

            <button class="tool" onclick="go('filters.html')">
                <span class="tool-icon">🎨</span>
                Filters
            </button>

            <button class="tool" onclick="go('speed.html')">
                <span class="tool-icon">⚡</span>
                Speed
            </button>

            <button class="tool" onclick="go('transform.html')">
                <span class="tool-icon">🔄</span>
                Transform
            </button>

            <button class="tool" onclick="go('effects.html')">
                <span class="tool-icon">✨</span>
                Effects
            </button>

            <button class="tool" onclick="go('stickers.html')">
                <span class="tool-icon">⭐</span>
                Stickers
            </button>

        </div>


        <!-- TIMELINE -->
        <div class="timeline">

            <div class="timeline-head">
                <span>🎞️ TIMELINE</span>
                <span id="duration">00:00</span>
            </div>

            <div class="track-label">
                VIDEO
            </div>

            <div class="track">

                <div
                    class="clip"
                    id="videoClip">
                    Import media
                </div>

            </div>


            <div class="track-label">
                AUDIO
            </div>

            <div class="track">

                <div
                    class="clip audio-track"
                    style="width:160px">
                    🎵 Audio track
                </div>

            </div>

        </div>

    </section>

</div>


<script>

function openFile(){

    document
        .getElementById("fileInput")
        .click();

}


function importMedia(input){

    const file = input.files[0];

    if(!file){
        return;
    }

    const url = URL.createObjectURL(file);

    const video =
        document.getElementById("videoPreview");

    const empty =
        document.getElementById("emptyScreen");

    const clip =
        document.getElementById("videoClip");


    if(file.type.startsWith("video/")){

        video.src = url;

        video.style.display = "block";

        empty.style.display = "none";

        video.onloadedmetadata = function(){

            const minutes =
                Math.floor(video.duration / 60);

            const seconds =
                Math.floor(video.duration % 60);

            document.getElementById("duration")
                .textContent =
                String(minutes).padStart(2,"0")
                + ":" +
                String(seconds).padStart(2,"0");

        };

    }

    else if(file.type.startsWith("image/")){

        video.style.display = "none";

        empty.innerHTML =
            '<div class="empty-icon">🖼️</div>' +
            '<p>' + file.name + '</p>';

    }


    clip.textContent = file.name;

    localStorage.setItem(
        "mediaName",
        file.name
    );

    localStorage.setItem(
        "mediaURL",
        url
    );

}


function go(page){

    window.location.href = page;

}

</script>

</body>
</html>
