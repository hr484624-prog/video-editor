<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VidyCut - Video Editor</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#08080c;
    color:white;
    min-height:100vh;
}

.header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid #25252d;
}

.logo{
    font-size:27px;
    font-weight:bold;
}

.logo span{
    color:#8b5cf6;
}

.settings{
    font-size:24px;
}

.container{
    padding:25px 18px 100px;
}

h1{
    font-size:29px;
    margin-bottom:8px;
}

.subtitle{
    color:#9696a3;
    margin-bottom:25px;
}

.create{
    background:linear-gradient(135deg,#8b5cf6,#6366f1);
    border-radius:20px;
    padding:30px 20px;
    text-align:center;
    margin-bottom:30px;
}

.camera{
    font-size:50px;
    margin-bottom:10px;
}

.create h2{
    font-size:23px;
    margin-bottom:8px;
}

.create p{
    color:#e5e5eb;
    font-size:14px;
    margin-bottom:20px;
}

.create-btn{
    display:inline-block;
    background:white;
    color:#111;
    padding:14px 28px;
    border-radius:30px;
    font-weight:bold;
    cursor:pointer;
}

.section{
    margin-bottom:28px;
}

.section h2{
    font-size:21px;
    margin-bottom:15px;
}

.tools{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:13px;
}

.tool{
    background:#17171e;
    border:1px solid #292932;
    border-radius:16px;
    padding:19px;
}

.icon{
    font-size:30px;
    margin-bottom:12px;
}

.tool h3{
    font-size:16px;
    margin-bottom:5px;
}

.tool p{
    color:#858590;
    font-size:12px;
}

.bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:75px;
    background:#111116;
    border-top:1px solid #292932;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.nav{
    text-align:center;
    color:#858590;
    font-size:12px;
}

.nav-icon{
    font-size:23px;
    margin-bottom:5
