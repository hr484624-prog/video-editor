<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GyanCut - Media</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#0d0e11;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.topbar{
    height:58px;
    background:#17181c;
    border-bottom:1px solid #292b31;
    display:flex;
    align-items:center;
    padding:0 18px;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.logo span{
    color:#a855f7;
}

.back{
    margin-left:auto;
    color:#aaa;
    text-decoration:none;
}

.back:hover{
    color:#fff;
}

.main{
    display:flex;
    min-height:calc(100vh - 58px);
}

.sidebar{
    width:190px;
    background:#15161a;
    border-right:1px solid #292b31;
    padding:10px 7px;
}

.menu{
    display:block;
    color:#aaa;
    text-decoration:none;
    padding:12px 10px;
    border-radius:8px;
    margin-bottom:3px;
    font-size:14px;
}

.menu:hover,
.menu.active{
    background:#29202f;
    color:#fff;
}

.content{
    flex:1;
    padding:30px;
}

h1{
    font-size:28px;
    margin-bottom:8px;
}

.subtitle{
    color:#777;
    margin-bottom:25px;
}

.import-box{
    border:2px dashed #3b3d46;
    border-radius:14px;
    min-height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    cursor:pointer;
    background:#121318;
}

.import-box:hover{
    border-color:#8b5cf6;
    background:#18151d;
}

.import-icon{
    font-size:45px;
    margin-bottom:12px;
}

.import-text{
    color:#aaa;
}

.import-button{
    margin-top:15px;
    background:#8b5cf6;
    border:none;
    color:#fff;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.library{
    margin-top:30px;
}

.library h2{
    font-size:18px;
    margin-bottom:15px;
}

.media-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:15px;
}

.media-card{
    background:#181a20;
    border:1px solid #292b31;
    border-radius:10px;
    overflow:hidden;
}

.media-preview{
    height:110px;
    background:#0a0b0e;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.media-preview img,
.media-preview video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.media-icon{
    font-size:35px;
}

.media-name{
    padding:10px;
    color:#bbb;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.empty-library{
    color:#666;
    padding:25px 0;
}

@media(max-width:700px){

    .sidebar{
        width:62px;
    }

    .menu{
        font-size:0;
        text-align:center;
    }

    .menu::first-letter{
        font-size:20px;
    }

    .content{
        padding:18px;
    }

    h1{
        font-size:22px;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <div class="logo">
        ✂️ Gyan<span>Cut</span>
    </div>

    <a class="back" href="index.html">
        ← Editor
    </a>

</header>


<div class="main">

<!-- SIDEBAR -->

<aside class="sidebar">

    <a class="menu" href="index.html">
        🎬 Editor
    </a>

    <a class="menu active" href="media.html">
        📁 Media
    </a>

    <a class="menu" href="trim.html">
        ✂️ Trim
    </a>

    <a class="menu" href="text.html">
        📝 Text
    </a>

    <a class="menu" href="audio.html">
        🎵 Audio
    </a>

    <a class="menu" href="filters.html">
        🎨 Filters
    </a>

    <a class="menu" href="speed.html">
        ⚡ Speed
    </a>

    <a class="menu" href="transform.html">
        🔄 Transform
    </a>

    <a class="menu" href="effects.html">
        ✨ Effects
    </a>

    <a class="menu" href="stickers.html">
        ⭐ Stickers
    </a>

    <a class="menu" href="timeline.html">
        🎞️ Timeline
    </a>

    <a class="menu" href="preview.html">
        👁️ Preview
    </a>

    <a class="menu" href="export.html">
        📤 Export
    </a>

    <a class="menu" href="settings.html">
        ⚙️ Settings
    </a>

</aside>


<!-- CONTENT -->

<section class="content">

    <h1>📁 Media</h1>

    <p class="subtitle">
        Import videos and photos into your project.
    </p>


    <label class="import-box" for="mediaInput">

        <div class="import-icon">
            📤
        </div>

        <div class="import-text">
            Click here to import video or photo
        </div>

        <div class="import-button">
            ＋ Import Media
        </div>

    </label>


    <input
        id="mediaInput"
        type="file"
        accept="video/*,image/*"
        multiple
        hidden
    >


    <div class="library">

        <h2>
            Your Media
        </h2>

        <div
            class="media-grid"
            id="mediaGrid">

            <div
                class="empty-library"
                id="emptyLibrary">

                No media imported yet.

            </div>

        </div>

    </div>

</section>

</div>


<script>

const input =
    document.getElementById("mediaInput");

const grid =
    document.getElementById("mediaGrid");

const empty =
    document.getElementById("emptyLibrary");


input.addEventListener("change", function(){

    const files = Array.from(this.files);

    if(files.length === 0){
        return;
    }

    empty.style.display = "none";


    files.forEach(function(file){

        const card =
            document.createElement("div");

        card.className =
            "media-card";


        const preview =
            document.createElement("div");

        preview.className =
            "media-preview";


        if(file.type.startsWith("image/")){

            const img =
                document.createElement("img");

            img.src =
                URL.createObjectURL(file);

            preview.appendChild(img);

        }

        else if(file.type.startsWith("video/")){

            const video =
                document.createElement("video");

            video.src =
                URL.createObjectURL(file);

            video.muted = true;

            video.preload = "metadata";

            preview.appendChild(video);

        }

        else{

            const icon =
                document.createElement("div");

            icon.className =
                "media-icon";

            icon.textContent =
                "📄";

            preview.appendChild(icon);

        }


        const name =
            document.createElement("div");

        name.className =
            "media-name";

        name.textContent =
            file.name;


        card.appendChild(preview);

        card.appendChild(name);

        grid.appendChild(card);

    });

});

</script>

</body>
</html>
