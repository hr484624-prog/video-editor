<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GyanCut - Text</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#0d0e11;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.topbar{
    height:58px;
    background:#17181c;
    border-bottom:1px solid #292b31;
    display:flex;
    align-items:center;
    padding:0 18px;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.logo span{
    color:#a855f7;
}

.back{
    margin-left:auto;
    color:#aaa;
    text-decoration:none;
}

.main{
    display:flex;
    min-height:calc(100vh - 58px);
}

.sidebar{
    width:190px;
    background:#15161a;
    border-right:1px solid #292b31;
    padding:10px 7px;
}

.menu{
    display:block;
    color:#aaa;
    text-decoration:none;
    padding:12px 10px;
    border-radius:8px;
    margin-bottom:3px;
    font-size:14px;
}

.menu:hover,
.menu.active{
    background:#29202f;
    color:#fff;
}

.content{
    flex:1;
    padding:25px;
    min-width:0;
}

h1{
    font-size:27px;
    margin-bottom:7px;
}

.subtitle{
    color:#777;
    margin-bottom:20px;
}

.editor{
    display:grid;
    grid-template-columns:minmax(300px,1fr) 330px;
    background:#15161a;
    border:1px solid #292b31;
    border-radius:12px;
    overflow:hidden;
    min-height:600px;
}

.preview{
    background:#08090b;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.preview video{
    max-width:90%;
    max-height:85%;
    display:none;
}

.preview-image{
    max-width:90%;
    max-height:85%;
    display:none;
}

.text-layer{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:42px;
    font-weight:bold;
    color:white;
    text-align:center;
    text-shadow:0 2px 8px #000;
    max-width:80%;
    word-break:break-word;
    display:none;
    pointer-events:none;
}

.empty{
    color:#666;
    text-align:center;
}

.empty-icon{
    font-size:45px;
    margin-bottom:10px;
}

.controls{
    border-left:1px solid #292b31;
    padding:20px;
    background:#17181c;
    overflow-y:auto;
}

.control-title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:18px;
}

label{
    display:block;
    color:#999;
    font-size:12px;
    margin:15px 0 7px;
}

textarea,
input[type="text"],
select{
    width:100%;
    background:#0d0e11;
    color:white;
    border:1px solid #383a43;
    border-radius:7px;
    padding:10px;
    outline:none;
}

textarea{
    resize:vertical;
    min-height:75px;
}

input[type="range"]{
    width:100%;
    accent-color:#8b5cf6;
}

.color-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.color{
    width:32px;
    height:32px;
    border-radius:50%;
    border:2px solid #555;
    cursor:pointer;
}

.white{background:white}
.red{background:#ef4444}
.yellow{background:#facc15}
.green{background:#22c55e}
.blue{background:#3b82f6}
.purple{background:#a855f7}

.align-row{
    display:flex;
    gap:6px;
}

.align{
    flex:1;
    background:#24262d;
    border:1px solid #353740;
    color:white;
    padding:9px;
    border-radius:6px;
    cursor:pointer;
}

.buttons{
    display:flex;
    gap:8px;
    margin-top:20px;
}

.btn{
    flex:1;
    border:1px solid #383a43;
    background:#24262d;
    color:white;
    padding:10px;
    border-radius:7px;
    cursor:pointer;
}

.btn.primary{
    background:#8b5cf6;
    border-color:#8b5cf6;
}

@media(max-width:800px){

    .sidebar{
        width:62px;
    }

    .menu{
        font-size:0;
        text-align:center;
    }

    .menu::first-letter{
        font-size:20px;
    }

    .content{
        padding:12px;
    }

    .editor{
        grid-template-columns:1fr;
    }

    .preview{
        min-height:400px;
    }

    .controls{
        border-left:0;
        border-top:1px solid #292b31;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <div class="logo">
        ✂️ Gyan<span>Cut</span>
    </div>

    <a class="back" href="index.html">
        ← Editor
    </a>

</header>


<div class="main">

<aside class="sidebar">

    <a class="menu" href="index.html">🎬 Editor</a>
    <a class="menu" href="media.html">📁 Media</a>
    <a class="menu" href="trim.html">✂️ Trim</a>
    <a class="menu active" href="text.html">📝 Text</a>
    <a class="menu" href="audio.html">🎵 Audio</a>
    <a class="menu" href="filters.html">🎨 Filters</a>
    <a class="menu" href="speed.html">⚡ Speed</a>
    <a class="menu" href="transform.html">🔄 Transform</a>
    <a class="menu" href="effects.html">✨ Effects</a>
    <a class="menu" href="stickers.html">⭐ Stickers</a>
    <a class="menu" href="timeline.html">🎞️ Timeline</a>
    <a class="menu" href="preview.html">👁️ Preview</a>
    <a class="menu" href="export.html">📤 Export</a>
    <a class="menu" href="settings.html">⚙️ Settings</a>

</aside>


<section class="content">

    <h1>📝 Text</h1>

    <p class="subtitle">
        Add and customize text on your video.
    </p>


    <div class="editor">


        <!-- PREVIEW -->

        <div class="preview">

            <video
                id="video"
                controls
                playsinline>
            </video>

            <div
                id="empty"
                class="empty">

                <div class="empty-icon">
                    📝
                </div>

                Import a video to preview your text

            </div>

            <div
                id="textLayer"
                class="text-layer">
            </div>

        </div>


        <!-- CONTROLS -->

        <div class="controls">

            <div class="control-title">
                Text Settings
            </div>


            <label>
                TEXT
            </label>

            <textarea
                id="textInput"
                placeholder="Type your text here..."
                oninput="updateText()"></textarea>


            <label>
                FONT
            </label>

            <select
                id="font"
                onchange="updateFont()">

                <option value="Arial">
                    Arial
                </option>

                <option value="Georgia">
                    Georgia
                </option>

                <option value="Verdana">
                    Verdana
                </option>

                <option value="Courier New">
                    Courier New
                </option>

                <option value="Impact">
                    Impact
                </option>

            </select>


            <label>
                SIZE
            </label>

            <input
                id="size"
                type="range"
                min="16"
                max="100"
                value="42"
                oninput="updateSize()">


            <label>
                COLOR
            </label>

            <div class="color-row">

                <button
                    class="color white"
                    onclick="setColor('#ffffff')">
                </button>

                <button
                    class="color red"
                    onclick="setColor('#ef4444')">
                </button>

                <button
                    class="color yellow"
                    onclick="setColor('#facc15')">
                </button>

                <button
                    class="color green"
                    onclick="setColor('#22c55e')">
                </button>

                <button
                    class="color blue"
                    onclick="setColor('#3b82f6')">
                </button>

                <button
                    class="color purple"
                    onclick="setColor('#a855f7')">
                </button>

            </div>


            <label>
                ALIGNMENT
            </label>

            <div class="align-row">

                <button
                    class="align"
                    onclick="setAlign('left')">
                    ←
                </button>

                <button
                    class="align"
                    onclick="setAlign('center')">
                    ↔
                </button>

                <button
                    class="align"
                    onclick="setAlign('right')">
                    →
                </button>

            </div>


            <label>
                STYLE
            </label>

            <div class="align-row">

                <button
                    class="align"
                    onclick="toggleBold()">
                    <b>B</b>
                </button>

                <button
                    class="align"
                    onclick="toggleItalic()">
                    <i>I</i>
                </button>

            </div>


            <div class="buttons">

                <button
                    class="btn"
                    onclick="clearText()">
                    Clear
                </button>

                <button
                    class="btn primary"
                    onclick="saveText()">
                    Add Text
                </button>

            </div>

        </div>

    </div>

</section>

</div>


<script>

const textLayer =
    document.getElementById("textLayer");

const textInput =
    document.getElementById("textInput");

const sizeInput =
    document.getElementById("size");

const fontInput =
    document.getElementById("font");


function updateText(){

    textLayer.textContent =
        textInput.value;

    textLayer.style.display =
        textInput.value.trim()
        ? "block"
        : "none";

}


function updateSize(){

    textLayer.style.fontSize =
        sizeInput.value + "px";

}


function updateFont(){

    textLayer.style.fontFamily =
        fontInput.value;

}


function setColor(color){

    textLayer.style.color =
        color;

}


function setAlign(value){

    textLayer.style.textAlign =
        value;

}


function toggleBold(){

    if(textLayer.style.fontWeight === "bold"){

        textLayer.style.fontWeight =
            "normal";

    }else{

        textLayer.style.fontWeight =
            "bold";

    }

}


function toggleItalic(){

    if(textLayer.style.fontStyle === "italic"){

        textLayer.style.fontStyle =
            "normal";

    }else{

        textLayer.style.fontStyle =
            "italic";

    }

}


function clearText(){

    textInput.value = "";

    textLayer.textContent = "";

    textLayer.style.display =
        "none";

}


function saveText(){

    localStorage.setItem(
        "projectText",
        textInput.value
    );

    localStorage.setItem(
        "textSize",
        sizeInput.value
    );

    localStorage.setItem(
        "textFont",
        fontInput.value
    );

    alert("Text added to your project.");

}


/* IMPORT VIDEO */

const savedVideo =
    localStorage.getItem("mediaURL");

if(savedVideo){

    const video =
        document.getElementById("video");

    video.src =
        savedVideo;

    video.style.display =
        "block";

    document.getElementById("empty")
        .style.display =
        "none";

}


/* LOAD SAVED TEXT */

const savedText =
    localStorage.getItem("projectText");

if(savedText){

    textInput.value =
        savedText;

    updateText();

}

</script>

</body>
</html>
